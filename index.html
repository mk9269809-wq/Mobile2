<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Germany Salary Calculator</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#1e293b;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
input{width:90%;padding:15px;border-radius:10px;border:none;font-size:18px;margin-bottom:15px}
button{width:100%;padding:15px;border-radius:10px;border:none;background:#38bdf8;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
.result{margin-top:20px;font-size:18px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>🇩🇪 Germany Salary</h2>
<input type="number" id="gross" value="5000" placeholder="Gross Salary">
<button onclick="calc()">Calculate Net</button>
<div class="result" id="result"></div>
</div>

<script>
function calc(){
 let gross = document.getElementById('gross').value;
 if(!gross){ alert("Salary likho!"); return; }
 let tax = gross * 0.20;
 let social = gross * 0.20;
 let net = gross - tax - social;
 document.getElementById('result').innerHTML = 
   "Gross: €" + gross + "<br>" +
   "Tax (20%): -€" + tax.toFixed(0) + "<br>" +
   "Social (20%): -€" + social.toFixed(0) + "<br><br>" +
   "<b>Net Salary: €" + net.toFixed(0) + "</b>";
}
</script>
</body>
</html>
